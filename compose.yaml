services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: nexo-postgres
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo_local_development}
      POSTGRES_DB: nexo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  nexo_data:
