# Online demonstration only. Choose plans in the provider dashboard before creating resources.
services:
  - type: web
    name: nexo-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: bash scripts/start-demo.sh
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO
        value: "true"
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-demo-db
          property: connectionString
databases:
  - name: nexo-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
